services:
  - type: web
    name: kafaatashgheleya
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kafaatashgheleya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: kafaatashgheleya-db
    plan: free
