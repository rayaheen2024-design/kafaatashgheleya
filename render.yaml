services:
  - type: web
    name: school-efficiency
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: school-efficiency-db
          property: connectionString

databases:
  - name: school-efficiency-db
    plan: free
